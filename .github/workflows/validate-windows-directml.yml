name: Validate Windows DirectML

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Load ONNX Runtime native module
        run: node -e "const ort = require('onnxruntime-node'); console.log('onnxruntime-node loaded', ort.env.versions);"

      - name: Typecheck and build
        run: npm run build

      - name: Install XAT Visual C++ prerequisite
        shell: pwsh
        run: |
          $redist = Join-Path $env:RUNNER_TEMP 'vcredist_x86_2012.exe'
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/1/6/B/16B06F60-3B20-4FF2-B699-5E9B7962F9AE/VSU_4/vcredist_x86.exe' -OutFile $redist
          $process = Start-Process -FilePath $redist -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 1638, 3010)) {
            throw "Visual C++ 2012 x86 installation failed with exit code $($process.ExitCode)."
          }

      - name: Smoke test official XAT runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'XAT.zip'
          $runtime = Join-Path $env:RUNNER_TEMP 'XAT-runtime'
          $container = Join-Path $env:RUNNER_TEMP 'xat-empty-container.hkx'
          Invoke-WebRequest -Uri 'https://github.com/Etheirys/XAT/releases/latest/download/XAT.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $runtime -Force
          $tool = Get-ChildItem -Path $runtime -Filter 'XATHavokInterop.exe' -Recurse | Select-Object -First 1
          if (-not $tool) { throw 'XATHavokInterop.exe was not found in the official XAT release.' }
          & $tool.FullName createContainer $container
          if ($LASTEXITCODE -ne 0) { throw "XATHavokInterop createContainer failed with exit code $LASTEXITCODE." }
          $output = Get-Item $container -ErrorAction Stop
          if ($output.Length -le 0) { throw 'XAT produced an empty Havok container.' }
          Write-Host "XAT runtime loaded and produced $($output.Length) bytes."
